<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booksky</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
       <!-- navbar -->
    <div id="navbar">
        <h1>Booksky</h1>
    </div>

    <!-- book details -->
     <div id="container">

    <div id="book-details">
        <h2>Rich Dad Poor Dad</h2>
        <h5>Robert</h5>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Enim at sunt nobis! Minima, excepturi debitis numquam, quasi recusandae incidunt blanditiis eius praesentium labore consequuntur dicta, voluptate placeat reiciendis eos dolorum?</p>
        <button onclick="deletebook(event)">Delete</button>
    </div>

     </div>

    <!-- add icon -->
     <button id="icon">+</button>

     <!-- popup-overlay -->
      <div id="popup-overlay"></div>

      <!-- popup-box -->
       <div id="popup-box">
        <h2>Add Book</h2>
        <form>
            <input type="text" placeholder="Book Title" id="book-title-input">
            <input type="text" placeholder="Book Author" id="book-author-input">
            <textarea placeholder="Short Description" id="book-description-input"></textarea>
            <button id="add-book-button">Add</button>
            <button id="cancel-popup">Cancel</button>
        </form>
       </div>


       <script src="./script.js"></script>
    
</body>
</html>
